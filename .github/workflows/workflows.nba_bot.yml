name: Run NBA Scoring Bot 

on:
  schedule:
    - cron: "0 22 * 10-12 * "
    - cron: "0 22 * 1-4 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Run NBA Scoring Bot
        run: |
          docker compose up --build --abort-on-container-exit
        env:
          BLUESKY_USERNAME: ${{ secrets.BLUESKY_USERNAME }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}

      - name: Diagnose NBA Stats response
        if: failure()
        run: |
          url='https://stats.nba.com/stats/leagueLeaders?ActiveFlag=No&LeagueID=00&PerMode=Totals&Scope=S&Season=All%20Time&SeasonType=Regular%20Season&StatCategory=PTS'
          headers_file=$(mktemp)
          body_file=$(mktemp)
          trap 'rm -f "$headers_file" "$body_file"' EXIT

          status=$(curl --silent --show-error --location --max-time 30 \
            --user-agent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/118.0.5993.117 Safari/537.36' \
            --header 'Referer: https://www.nba.com/' \
            --header 'Origin: https://www.nba.com' \
            --dump-header "$headers_file" --output "$body_file" \
            --write-out '%{http_code}' "$url") || true

          echo "NBA Stats diagnostic HTTP status: ${status:-unavailable}"
          echo "NBA Stats diagnostic content type:"
          grep -i '^content-type:' "$headers_file" | tail -n 1 || true
          echo "NBA Stats diagnostic response excerpt (first 200 bytes):"
          head -c 200 "$body_file" 2>/dev/null || true
          echo

      - name: Debug - Check File Changes
        run: |
          echo "Checking if CSV files were modified..."
          ls -l nba/
          git status
          git diff --stat

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and Push Changes
        run: |
          if git status --porcelain | grep -E "nba/old_nba_scoring_data.csv|nba/new_nba_scoring_data.csv"; then
            git fetch origin main
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add nba/old_nba_scoring_data.csv nba/new_nba_scoring_data.csv
            git commit -m "Update NBA scoring data [$(date)]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit"
          fi
      
