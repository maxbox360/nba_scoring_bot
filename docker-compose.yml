services:
  nba_scoring_bot:
    container_name: nba_bot_container
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      BLUESKY_USERNAME: ${BLUESKY_USERNAME}
      BLUESKY_PASSWORD: ${BLUESKY_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONUNBUFFERED: "1"
    volumes:
      - .:/code
    command: python3 main.py
